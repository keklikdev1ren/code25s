<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Görevler & Bucket List</title>
<script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-firestore.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter',Arial,sans-serif;padding:10px;background-color:#f4f7f9;color:#2c3e50}
.page{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{text-align:center;font-size:22px;margin:6px 0}h3{color:#34495e;font-size:17px;margin-bottom:10px}
.card{background:#fff;border:1px solid #ddd;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.08);padding:16px}
.card.yellow{border:2px solid #f1c40f;background:#fffdf0}.card.red{border:2px solid #e74c3c;background:#fff6f5}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-title{font-weight:bold;font-size:17px;flex:1;text-align:center}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid #ccc;background:#ecf0f1;cursor:pointer;font-size:18px;line-height:1;flex:0 0 auto}.icon-btn:hover{background:#dfe6e9}
.weekdays,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.weekdays div{text-align:center;font-size:12px;font-weight:bold;color:#7f8c8d;padding:4px 0}
.cd{height:42px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.cd:hover{background:#ecf0f1}
.cd.today{border:2px solid #3498db}.cd.sel{background:#3498db;color:#fff}.cd.empty{border:none;background:none;cursor:default}
.dot{width:6px;height:6px;border-radius:50%}.dot.g{background:#2ecc71}.dot.y{background:#f1c40f}.dot.r{background:#e74c3c}
.row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:2px dotted #bbb}
.chk{width:24px;height:24px;border:2px solid #7f8c8d;border-radius:5px;flex:0 0 auto;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff;font-size:16px}.chk.on{background:#2ecc71;border-color:#27ae60}
.rt{flex:1;min-width:0;word-break:break-word}.rt.done{color:#95a5a6;text-decoration:line-through}.rt small{color:#7f8c8d}
.dots{width:32px;height:32px;border-radius:50%;border:1px solid #bbb;background:#f8f9fa;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:bold;flex:0 0 auto}.dots:hover{background:#dfe6e9}
.add-row{display:flex;gap:8px;margin-top:12px}.add-row input{flex:1;min-width:0}
input[type=text],input[type=date],input[type=time],select{padding:10px;font-size:15px;border:1px solid #ccc;border-radius:6px;width:100%}
.btn{padding:10px 16px;border:none;border-radius:8px;cursor:pointer;color:#fff;font-size:15px;background:#3498db;box-shadow:0 3px #2980b9}.btn:active{transform:translateY(2px);box-shadow:0 1px #2980b9}
.btn.red{background:#e74c3c;box-shadow:0 3px #c0392b}.btn.green{background:#27ae60;box-shadow:0 3px #229954}.btn.big{width:100%;padding:13px;font-size:17px}
.ann{padding:8px 4px;border-bottom:1px solid #f1e6a8;font-size:15px}.ann:last-child{border:none}.empty-note{color:#95a5a6;text-align:center;padding:10px;font-size:14px}
.modal{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;overflow:auto;background:rgba(0,0,0,.5)}
.modal-content{background:#fefefe;margin:4% auto;padding:20px;border-radius:12px;width:92%;max-width:560px;max-height:90vh;overflow-y:auto}
.close-modal{color:#aaa;float:right;font-size:32px;font-weight:bold;cursor:pointer;line-height:20px}.close-modal:hover{color:#000}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.form-grid .full{grid-column:1/-1}.form-grid label{font-size:12px;color:#7f8c8d;display:block;margin-bottom:2px}
.prop{display:flex;gap:10px;align-items:flex-start;padding:10px;background:#f8f9fa;border-radius:8px;margin-bottom:8px;font-size:14px}.prop input{margin-top:3px;width:18px;height:18px}
.rline{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dotted #ccc;font-size:14px}.rline span{flex:1}.tag{font-size:11px;padding:2px 6px;border-radius:4px;background:#ecf0f1;margin-right:4px}
</style>
</head>
<body>
<div class="page">
<h1>✅ Günlük Görevler</h1>

<div class="card">
<div class="cal-head">
<button class="icon-btn" onclick="changeMonth(-1)">‹</button>
<div class="cal-title" id="cal-title"></div>
<button class="icon-btn" onclick="changeMonth(1)">›</button>
<button class="icon-btn" onclick="openSettings()" title="Rutinler">⚙️</button>
</div>
<div class="weekdays"><div>Pzt</div><div>Sal</div><div>Çar</div><div>Per</div><div>Cum</div><div>Cmt</div><div>Paz</div></div>
<div class="cal-grid" id="cal-grid"></div>
<h3 id="day-title" style="margin-top:16px;"></h3>
<div id="day-list"></div>
<div class="add-row"><input type="text" id="new-task" placeholder="Yeni görev ekle..." onkeydown="if(event.key==='Enter')addTask()"><button class="btn green" onclick="addTask()">Ekle</button></div>
</div>

<div class="card yellow"><h3>🔔 Bugünün Görevleri & Duyuruları</h3><div id="ann-list"></div></div>

<div class="card"><h3>🪣 Bucket List</h3><div id="bucket-list"></div>
<div class="add-row"><input type="text" id="new-bucket" placeholder="Yeni etkinlik ekle..." onkeydown="if(event.key==='Enter')addBucket()"><button class="btn green" onclick="addBucket()">Ekle</button></div></div>

<div class="card red"><h3>📌 Önceki Günlerden Gelen Görevler</h3><div id="carried-list"></div></div>

<button class="btn red big" onclick="openFailed()">⚠️ Zamanı Geçmiş Başarısız Görevler</button>
</div>

<div id="props-modal" class="modal"><div class="modal-content">
<span class="close-modal" onclick="closeModal('props-modal')">&times;</span>
<h3 id="props-title">Görev Ayarları</h3>
<div id="props-body"></div>
</div></div>

<div id="settings-modal" class="modal"><div class="modal-content">
<span class="close-modal" onclick="closeModal('settings-modal')">&times;</span>
<h3>⚙️ Sürekli Rutinler</h3>
<div id="routine-list"></div>
<h3 style="margin-top:18px;">Yeni Rutin Ekle</h3>
<div class="form-grid">
<div class="full"><label>Tür</label><select id="r-kind" onchange="syncForm()">
<option value="duyuru">🔔 Duyuru (tik gerekmez)</option>
<option value="gorev">✅ Tikli rutin görev</option>
<option value="kismi">📌 Kısmi mutlak görev (başlangıç → bitiş)</option></select></div>
<div class="full"><label>Başlık</label><input type="text" id="r-title" placeholder="Örn: Matematik dersi"></div>
<div id="f-repeat"><label>Tekrar</label><select id="r-repeat" onchange="syncForm()"><option value="weekly">Her hafta</option><option value="once">Tek seferlik</option></select></div>
<div id="f-wd"><label id="l-wd">Gün</label><select id="r-wd"></select></div>
<div id="f-date" style="display:none"><label>Tarih</label><input type="date" id="r-date"></div>
<div><label id="l-time">Saat</label><input type="time" id="r-time"></div>
<div id="f-ewd" style="display:none"><label>Bitiş günü</label><select id="r-ewd"></select></div>
<div id="f-etime" style="display:none"><label>Bitiş saati</label><input type="time" id="r-etime"></div>
</div>
<button class="btn green big" onclick="addRoutine()">Rutini Kaydet</button>
</div></div>

<div id="failed-modal" class="modal"><div class="modal-content">
<span class="close-modal" onclick="closeModal('failed-modal')">&times;</span>
<h3>⚠️ Başarısız Görevler</h3>
<div id="failed-list"></div>
</div></div>

<script>
const firebaseConfig={apiKey:"AIzaSyAIGzwmEB9F7K7KQzsEU5etVWejZ3oSluc",authDomain:"paralayici.firebaseapp.com",projectId:"paralayici",storageBucket:"paralayici.firebasestorage.app",messagingSenderId:"980843550614",appId:"1:980843550614:web:93dd5bda4ddc377b20efb7"};
const TASKS="todo_tasks",ROUT="todo_routines",BUCKET="todo_bucket",DAYS=[['Pazartesi',1],['Salı',2],['Çarşamba',3],['Perşembe',4],['Cuma',5],['Cumartesi',6],['Pazar',0]],MONTHS=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
/* Görev özellikleri: yeni özellik eklemek için bu listeye bir satır eklemek yeterli */
const PROPS=[{key:'mutlak',label:'📌 Mutlak görev',desc:'Tamamlanmazsa başarısız sayılmaz, her gün "Önceki günlerden gelen görevler" kutusunda görünür.'}];
let db,tasks=[],routines=[],bucket=[],calMonth=new Date(),sel='',curId=null;
const pad=n=>String(n).padStart(2,'0'),fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)},addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)},todayStr=()=>fmt(new Date()),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
try{firebase.initializeApp(firebaseConfig);db=firebase.firestore();}catch(e){document.body.innerHTML="<h1>Hata</h1><p>Firebase yapılandırma hatası.</p>";}

/* ---------- Yükleme ---------- */
async function loadAll(){const get=async c=>{const r=[];(await db.collection(c).get()).forEach(d=>r.push({...d.data(),id:d.id}));return r;};try{[tasks,routines,bucket]=await Promise.all([get(TASKS),get(ROUT),get(BUCKET)]);tasks.forEach(t=>{t.props=t.props||{};});await materialize();}catch(e){console.error(e);alert('Veriler yüklenemedi.');}renderAll();}
function matches(r,ds){return r.repeat==='once'?r.date===ds:(parse(ds).getDay()===r.weekday&&ds>=r.created);}
async function materialize(){const t0=todayStr(),from=addDays(t0,-60),to=addDays(t0,7),have=new Set(tasks.map(t=>t.id)),batch=db.batch();let n=0;routines.filter(r=>r.kind!=='duyuru').forEach(r=>{for(let ds=(r.created>from?r.created:from);ds<=to;ds=addDays(ds,1)){if(!matches(r,ds))continue;const id=`r_${r.id}_${ds}`;if(have.has(id))continue;const t={id,title:r.title,date:ds,time:r.time||'',done:false,props:{},created:Date.now(),kind:r.kind==='kismi'?'kismi':'task',rid:r.id};if(r.kind==='kismi'){t.endDate=addDays(ds,((r.endWeekday-r.weekday+7)%7)||7);t.endTime=r.endTime||'00:00';}tasks.push(t);batch.set(db.collection(TASKS).doc(id),t);n++;}});if(n)await batch.commit();}

/* ---------- Mantık ---------- */
const live=()=>tasks.filter(t=>!t.deleted);
function tasksOn(ds){return live().filter(t=>t.kind==='kismi'?(t.date<=ds&&ds<=t.endDate&&(t.date===ds||!t.done)):t.date===ds).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99')||a.created-b.created);}
function isFailed(t){if(t.done||t.deleted)return false;if(t.kind==='kismi')return new Date(`${t.endDate}T${t.endTime||'00:00'}`)<new Date();return !t.props.mutlak&&t.date<todayStr();}
function carried(){const t0=todayStr();return live().filter(t=>!t.done&&t.props.mutlak&&t.kind!=='kismi'&&t.date<t0).sort((a,b)=>a.date.localeCompare(b.date));}
function announcements(){const t0=todayStr(),tm=addDays(t0,1),a=[],hm=r=>r.time?` (${r.time})`:'';routines.forEach(r=>{if(r.kind==='duyuru'&&matches(r,t0))a.push('Bugün: '+esc(r.title)+hm(r));if(matches(r,tm))a.push('Yarın: '+esc(r.title)+hm(r));});live().filter(t=>!t.done&&t.kind==='kismi'&&t.endDate===t0).forEach(t=>a.push(`⏳ Bugün son: ${esc(t.title)} (${t.endTime})`));return a;}

/* ---------- Çizim ---------- */
function rowHtml(t,showDate){return `<div class="row"><div class="chk ${t.done?'on':''}" onclick="toggleTask('${t.id}')">${t.done?'✓':''}</div><div class="rt ${t.done?'done':''}">${esc(t.title)}${t.props.mutlak?' 📌':''}<br><small>${showDate?parse(t.date).toLocaleDateString('tr-TR')+' ':''}${t.time||''}${t.kind==='kismi'?` → ${parse(t.endDate).toLocaleDateString('tr-TR')} ${t.endTime}`:''}</small></div><div class="dots" onclick="openProps('${t.id}')">⋯</div></div>`;}
function renderCal(){const y=calMonth.getFullYear(),m=calMonth.getMonth(),first=new Date(y,m,1).getDay(),start=first===0?6:first-1,dim=new Date(y,m+1,0).getDate(),t0=todayStr();document.getElementById('cal-title').textContent=`${MONTHS[m]} ${y}`;let h='';for(let i=0;i<start;i++)h+='<div class="cd empty"></div>';for(let d=1;d<=dim;d++){const ds=`${y}-${pad(m+1)}-${pad(d)}`,ts=live().filter(t=>t.kind!=='kismi'&&t.date===ds);let dot='';if(ts.length)dot=ts.every(t=>t.done)?'g':(ds<t0&&ts.some(t=>!t.done&&!t.props.mutlak)?'r':'y');h+=`<div class="cd ${ds===t0?'today':''} ${ds===sel?'sel':''}" onclick="selectDay('${ds}')">${d}${dot?`<span class="dot ${dot}"></span>`:''}</div>`;}document.getElementById('cal-grid').innerHTML=h;}
function renderDay(){const d=parse(sel);document.getElementById('day-title').textContent=`${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()} — ${DAYS.find(x=>x[1]===d.getDay())[0]}`;const ts=tasksOn(sel);document.getElementById('day-list').innerHTML=ts.length?ts.map(t=>rowHtml(t)).join(''):'<div class="empty-note">Bu gün için görev yok.</div>';}
function renderAnn(){const a=announcements();document.getElementById('ann-list').innerHTML=a.length?a.map(x=>`<div class="ann">🔔 ${x}</div>`).join(''):'<div class="empty-note">Bugün için duyuru yok.</div>';}
function renderBucket(){document.getElementById('bucket-list').innerHTML=bucket.length?bucket.sort((a,b)=>a.created-b.created).map(b=>`<div class="row"><div class="chk ${b.done?'on':''}" onclick="toggleBucket('${b.id}')">${b.done?'✓':''}</div><div class="rt ${b.done?'done':''}">${esc(b.title)}</div><div class="dots" onclick="delBucket('${b.id}')" title="Sil">×</div></div>`).join(''):'<div class="empty-note">Henüz etkinlik yok.</div>';}
function renderCarried(){const c=carried();document.getElementById('carried-list').innerHTML=c.length?c.map(t=>rowHtml(t,true)).join(''):'<div class="empty-note">Aktarılan görev yok 🎉</div>';}
function renderAll(){renderCal();renderDay();renderAnn();renderBucket();renderCarried();}
function selectDay(ds){sel=ds;renderCal();renderDay();}
function changeMonth(n){calMonth.setDate(1);calMonth.setMonth(calMonth.getMonth()+n);renderCal();}
function closeModal(id){document.getElementById(id).style.display='none';}

/* ---------- Görev işlemleri ---------- */
const find=id=>tasks.find(t=>t.id===id);
async function toggleTask(id){const t=find(id);t.done=!t.done;await db.collection(TASKS).doc(id).update({done:t.done});renderAll();if(document.getElementById('failed-modal').style.display==='block')openFailed();}
async function addTask(){const inp=document.getElementById('new-task'),title=inp.value.trim();if(!title)return;const t={title,date:sel,time:'',done:false,props:{},created:Date.now(),kind:'task'},ref=await db.collection(TASKS).add(t);t.id=ref.id;tasks.push(t);inp.value='';renderAll();}
function openProps(id){curId=id;const t=find(id);document.getElementById('props-title').textContent='Görev Ayarları';document.getElementById('props-body').innerHTML=`<input type="text" id="p-title" value="${esc(t.title)}" onchange="renameTask(this.value)" style="margin-bottom:12px">${PROPS.map(p=>`<label class="prop"><input type="checkbox" ${t.props[p.key]?'checked':''} onchange="setProp('${p.key}',this.checked)"><span><strong>${p.label}</strong><br><small>${p.desc}</small></span></label>`).join('')}<div class="add-row"><input type="date" id="p-date" value="${t.date}"><button class="btn" onclick="moveTask()">Güne Taşı</button></div><button class="btn red big" style="margin-top:14px" onclick="deleteTask()">🗑️ Görevi Sil</button>`;document.getElementById('props-modal').style.display='block';}
async function renameTask(v){v=v.trim();if(!v)return;const t=find(curId);t.title=v;await db.collection(TASKS).doc(curId).update({title:v});renderAll();}
async function setProp(k,v){const t=find(curId);t.props[k]=v;await db.collection(TASKS).doc(curId).update({props:t.props});renderAll();}
async function moveTask(){const v=document.getElementById('p-date').value;if(!v)return;const t=find(curId);if(t.kind==='kismi'){alert('Kısmi görevlerin tarihi rutinden gelir.');return;}t.date=v;await db.collection(TASKS).doc(curId).update({date:v});closeModal('props-modal');renderAll();}
async function deleteTask(){if(!confirm('Bu görev silinsin mi?'))return;const t=find(curId);if(t.id.startsWith('r_')){t.deleted=true;await db.collection(TASKS).doc(curId).update({deleted:true});}else{await db.collection(TASKS).doc(curId).delete();tasks=tasks.filter(x=>x.id!==curId);}closeModal('props-modal');renderAll();}

/* ---------- Bucket list ---------- */
async function addBucket(){const inp=document.getElementById('new-bucket'),title=inp.value.trim();if(!title)return;const b={title,done:false,created:Date.now()},ref=await db.collection(BUCKET).add(b);b.id=ref.id;bucket.push(b);inp.value='';renderBucket();}
async function toggleBucket(id){const b=bucket.find(x=>x.id===id);b.done=!b.done;await db.collection(BUCKET).doc(id).update({done:b.done});renderBucket();}
async function delBucket(id){if(!confirm('Silinsin mi?'))return;await db.collection(BUCKET).doc(id).delete();bucket=bucket.filter(x=>x.id!==id);renderBucket();}

/* ---------- Başarısız görevler ---------- */
function openFailed(){const f=live().filter(isFailed).sort((a,b)=>(a.kind==='kismi'?a.endDate:a.date).localeCompare(b.kind==='kismi'?b.endDate:b.date));document.getElementById('failed-list').innerHTML=f.length?f.map(t=>rowHtml(t,true)).join(''):'<div class="empty-note">Başarısız görev yok 🎉</div>';document.getElementById('failed-modal').style.display='block';}

/* ---------- Rutinler ---------- */
function syncForm(){const k=document.getElementById('r-kind').value,once=document.getElementById('r-repeat').value==='once'&&k!=='kismi',show=(id,v)=>document.getElementById(id).style.display=v?'block':'none';if(k==='kismi')document.getElementById('r-repeat').value='weekly';show('f-repeat',k!=='kismi');show('f-wd',!once);show('f-date',once);show('f-ewd',k==='kismi');show('f-etime',k==='kismi');document.getElementById('l-wd').textContent=k==='kismi'?'Başlangıç günü':'Gün';document.getElementById('l-time').textContent=k==='kismi'?'Başlangıç saati':'Saat';}
function describe(r){const wd=v=>DAYS.find(x=>x[1]===v)[0],k={duyuru:'Duyuru',gorev:'Tikli',kismi:'Kısmi mutlak'}[r.kind];return `<span class="tag">${k}</span>${r.repeat==='once'?parse(r.date).toLocaleDateString('tr-TR'):'Her '+wd(r.weekday)} ${r.time||''}${r.kind==='kismi'?` → ${wd(r.endWeekday)} ${r.endTime||''}`:''}`;}
function openSettings(){const opts=DAYS.map(d=>`<option value="${d[1]}">${d[0]}</option>`).join('');document.getElementById('r-wd').innerHTML=opts;document.getElementById('r-ewd').innerHTML=opts;syncForm();document.getElementById('routine-list').innerHTML=routines.length?routines.map(r=>`<div class="rline"><span><strong>${esc(r.title)}</strong><br>${describe(r)}</span><button class="btn red" onclick="deleteRoutine('${r.id}')">Sil</button></div>`).join(''):'<div class="empty-note">Henüz rutin yok.</div>';document.getElementById('settings-modal').style.display='block';}
async function addRoutine(){const g=id=>document.getElementById(id).value,kind=g('r-kind'),title=g('r-title').trim();if(!title){alert('Başlık yaz.');return;}const repeat=kind==='kismi'?'weekly':g('r-repeat'),r={kind,title,repeat,weekday:parseInt(g('r-wd')),date:g('r-date'),time:g('r-time'),endWeekday:parseInt(g('r-ewd')),endTime:g('r-etime'),created:todayStr()};if(repeat==='once'&&!r.date){alert('Tarih seç.');return;}const ref=await db.collection(ROUT).add(r);r.id=ref.id;routines.push(r);document.getElementById('r-title').value='';await materialize();renderAll();openSettings();}
async function deleteRoutine(id){if(!confirm('Rutin silinsin mi? (Tamamlanmamış gelecek görevleri de silinir)'))return;await db.collection(ROUT).doc(id).delete();routines=routines.filter(r=>r.id!==id);const t0=todayStr(),batch=db.batch();tasks.filter(t=>t.rid===id&&!t.done&&t.date>=t0).forEach(t=>{t.deleted=true;batch.update(db.collection(TASKS).doc(t.id),{deleted:true});});await batch.commit();renderAll();openSettings();}

window.onclick=e=>{['props-modal','settings-modal','failed-modal'].forEach(id=>{const m=document.getElementById(id);if(e.target==m)m.style.display='none';});};
window.onload=()=>{sel=todayStr();loadAll();};
</script>
</body>
</html>
